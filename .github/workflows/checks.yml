name: Synthetic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - run: python3 -m unittest discover -s tests -v
      - run: php examples/request-memo.php
      - name: Install isolated example dependencies
        run: |
          mkdir /tmp/laravel-components
          composer require --working-dir=/tmp/laravel-components --no-interaction --no-scripts 'illuminate/container:^12.0' 'illuminate/cache:^12.0' 'illuminate/database:^12.0'
      - run: php examples/laravel-benchmark.php /tmp/laravel-components/vendor/autoload.php /tmp/laravel-results
      - run: python3 scripts/compare.py /tmp/laravel-results/baseline.json /tmp/laravel-results/candidate.json --max-regression 20
